# Per-repo standards exemptions, honored by distribute and `git repo standards
# verify`, and counted by the anti-rot ratchet so they must shrink toward zero.
exempt:
  # Vim's runtime REQUIRES plugin help files at doc/ (`:help add-local-help`,
  # tags generated by `:helptags`); moving them breaks the plugin. This is the
  # distribution format, not internal project documentation — project docs
  # still live in docs.tsvsheet.vim, specs in tsvsheet/_projects/specs/.
  internal-content: "doc/ is Vim's mandated help-file location for a distributable plugin, not internal docs"
